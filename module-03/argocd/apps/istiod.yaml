apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istiod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: istiod
    targetRevision: 1.30.6
    helm:
      releaseName: istiod
      valuesObject:
        sidecarInjectorWebhook:
          # Увімкнено перехоплення вебхука для неймспейсів за замовчуванням + reinvocationPolicy=IfNeeded,
          # але neverInjectSelector блокує інжекцію для всіх подів, окрім тих, яким Kyverno
          # виставив sidecar.istio.io/inject="true" на основі лейбла person="student".
          enableNamespacesByDefault: true
          reinvocationPolicy: IfNeeded
          alwaysInjectSelector:
            - matchLabels:
                sidecar.istio.io/inject: "true"
          neverInjectSelector:
            - matchExpressions:
                - key: sidecar.istio.io/inject
                  operator: NotIn
                  values:
                    - "true"
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
        - .webhooks[]?.failurePolicy
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
        - .webhooks[]?.failurePolicy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
