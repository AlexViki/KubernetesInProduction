apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lab-tenants
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/AlexViki/KubernetesInProduction.git
    targetRevision: feat/module-03-platform-engineering
    path: module-03/charts/lab-tenants
    helm:
      releaseName: lab-tenants
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  ignoreDifferences:
    - group: kyverno.io
      kind: ClusterPolicy
      jqPathExpressions:
        - .spec.admission
        - .spec.emitWarning
        - .spec.rules[]?.skipBackgroundRequests
        - .spec.rules[]?.match?.resources
        - .spec.rules[]?.exclude?.resources
        - .spec.rules[]?.generate?.clone
        - .spec.rules[]?.generate?.cloneList
        - .spec.rules[]?.validate?.allowExistingViolations
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
