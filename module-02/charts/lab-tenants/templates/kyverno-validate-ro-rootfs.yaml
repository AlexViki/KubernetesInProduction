{{- if and .Values.kyvernoPolicies.enabled .Values.kyvernoPolicies.auditReadOnlyRootFilesystem }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-ro-rootfs
  annotations:
    policies.kyverno.io/title: Require Read-Only Root Filesystem (Audit)
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Перевіряє, що всі контейнери у Поді мають securityContext.readOnlyRootFilesystem: true.
      Працює в режимі Audit (не блокує створення подів, але створює записи у PolicyReport).
spec:
  background: true
  rules:
    - name: validate-readOnlyRootFilesystem
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        failureAction: Audit
        message: "Коренева файлова система контейнера має бути в режимі тільки для читання (securityContext.readOnlyRootFilesystem: true)."
        pattern:
          spec:
            containers:
              - securityContext:
                  readOnlyRootFilesystem: true
            =(initContainers):
              - securityContext:
                  readOnlyRootFilesystem: true
            =(ephemeralContainers):
              - securityContext:
                  readOnlyRootFilesystem: true
{{- end }}
